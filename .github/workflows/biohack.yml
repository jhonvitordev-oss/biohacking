name: Biohacking Content Publisher

on:
  schedule:
    # Runs Mon, Wed, Fri at 10:00 UTC
    - cron: "0 10 * * 1,3,5"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Run biohacking bot
        env:
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          MEDIUM_TOKEN:         ${{ secrets.MEDIUM_TOKEN }}
          MEDIUM_USER_ID:       ${{ secrets.MEDIUM_USER_ID }}
          SUBSTACK_URL:         ${{ secrets.SUBSTACK_URL }}
          SUBSTACK_EMAIL:       ${{ secrets.SUBSTACK_EMAIL }}
          SUBSTACK_PASSWORD:    ${{ secrets.SUBSTACK_PASSWORD }}
          VOCAL_EMAIL:          ${{ secrets.VOCAL_EMAIL }}
          VOCAL_PASSWORD:       ${{ secrets.VOCAL_PASSWORD }}
        run: python biohack_bot.py

      - name: Commit state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add biohack_state.json biohack_used_keywords.txt || true
          git diff --staged --quiet || git commit -m "chore: update biohack state [skip ci]"
          git push
